name: Business Alerts Heartbeat

# Hobby-plan Vercel crons only run once per day, so the frequent staff-keepalive
# and failed-alert retry loops are driven here instead (same pattern as
# platform-drain.yml). Both endpoints are idempotent and internally deduped,
# so a missed or doubled tick is harmless.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Each endpoint is independent, so a failure must not stop the ones after
      # it — hence continue-on-error. The gate step at the end re-fails the job,
      # otherwise a run where every call 401s still reports green.
      - name: Staff session keepalive
        id: keepalive
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/ka.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            https://ariesai.in/api/cron/session-keepalive)
          echo "cron/session-keepalive -> $code"
          cat /tmp/ka.json || true
          [ "$code" = "200" ] || exit 1

      - name: Retry failed business notifications
        id: retry
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/nr.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            https://ariesai.in/api/cron/notification-retry)
          echo "cron/notification-retry -> $code"
          cat /tmp/nr.json || true
          [ "$code" = "200" ] || exit 1

      - name: Fail if any endpoint failed
        env:
          KEEPALIVE: ${{ steps.keepalive.outcome }}
          RETRY: ${{ steps.retry.outcome }}
        run: |
          failed=""
          if [ "$KEEPALIVE" = "failure" ]; then failed="$failed cron/session-keepalive"; fi
          if [ "$RETRY" = "failure" ]; then failed="$failed cron/notification-retry"; fi
          if [ -n "$failed" ]; then
            echo "Failed endpoints:$failed"
            echo "A 401 on every endpoint means the Vercel CRON_SECRET no longer matches the CRON_SECRET GitHub Actions secret."
            exit 1
          fi
          echo "All endpoints returned 200"
